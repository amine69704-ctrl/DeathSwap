name: DeathSwap
version: 1.1.0
main: me.deathswap.DeathSwap
api-version: '1.21'
author: DeathSwap Team
description: DeathSwap Minecraft plugin

commands:
  deathswap:
    description: DeathSwap main command
    usage: /deathswap <team1|team2|start|stop|reset|timer|score|teams|scoreboard>
    aliases:
      - ds

permissions:
  deathswap.admin:
    description: Allows management of DeathSwap teams and game controls
    default: op
