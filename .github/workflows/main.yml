name: Build DeathSwap Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Prepare Maven project
        run: |
          mkdir -p src/main/java/me/deathswap
          mkdir -p src/main/resources
          cp DeathSwap.java src/main/java/me/deathswap/DeathSwap.java
          cp plugin.yml src/main/resources/plugin.yml
          cp config.yml src/main/resources/config.yml

      - name: Build plugin
        run: mvn -B package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathSwap
          path: target/*.jar
